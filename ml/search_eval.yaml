# Labelled queries for evaluating search (see ml/search_eval.py). Written BEFORE looking at any scores.
# `relevant` = ids a reasonable viewer would expect for that query (judged from the film itself plus its catalogue
# text). An empty list means "nothing in the catalogue should match": the right answer is NO results.
#
# Two sets, on purpose:
#   dev  - used ONLY to pick the cosine floor (SEARCH_VEC_FLOOR). Tuning on these is allowed.
#   test - the reported numbers. Never used for tuning.
dev:
  - {q: "a dragon and a warrior", relevant: [sintel]}
  - {q: "bunny", relevant: [big-buck-bunny]}
  - {q: "a sheep with endless lives", relevant: [cosmos-laundromat]}
  - {q: "mysterious machine", relevant: [elephants-dream]}
  - {q: "future robot war", relevant: [tears-of-steel]}
  - {q: "baking a chocolate cake", relevant: []}
  - {q: "tax filing deadline", relevant: []}
  - {q: "basketball game score", relevant: []}
  - {q: "learn spanish grammar", relevant: []}
test:
