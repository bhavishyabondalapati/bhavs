# CI: everything that can be checked WITHOUT AWS credentials or secrets.
# AWS is faked with moto in the Python tests; the E2E job runs only the signed-out checks.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: ML dependencies (CPU-only PyTorch)
        run: |
          pip install numpy scipy
          pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: ruff check .
      - run: pytest -q
        env:
          AWS_DEFAULT_REGION: us-east-2
          AWS_ACCESS_KEY_ID: testing
          AWS_SECRET_ACCESS_KEY: testing

  web:
    # Pinned: ubuntu-latest is 26.04, which Playwright 1.56 cannot install Chromium on. Unpin after upgrading Playwright.
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build
      - name: Signed-out E2E (pages, redirects, security headers)
        run: |
          npx playwright install --with-deps chromium
          (npm run start -- -p 3100 &)
          for i in $(seq 1 30); do curl -sf -o /dev/null http://localhost:3100/login && break; sleep 2; done
          npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report

  terraform:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        stack: [bootstrap, persistent, app]
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.17.1"
      - run: terraform fmt -check -recursive infra
      - run: terraform -chdir=infra/${{ matrix.stack }} init -backend=false -input=false
      - run: terraform -chdir=infra/${{ matrix.stack }} validate
